<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="planetGrad1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7fb8ff"/>
      <stop offset="55%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1b4d8a"/>
    </radialGradient>
    <radialGradient id="planetGrad2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffb26e"/>
      <stop offset="60%" stop-color="#EE6901"/>
      <stop offset="100%" stop-color="#7a3200"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Starfield -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="80" r="1" ><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="40" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="120" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="150" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="30" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="200" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="90" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="230" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="50" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="180" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="70" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="220" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="100" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="250" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="260" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="270" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Shooting stars -->
  <g stroke="#58A6FF" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <line x1="0" y1="0" x2="70" y2="35" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 550 250" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="60" y2="30" opacity="0" stroke="#EE6901">
      <animate attributeName="opacity" values="0;0;0;1;0;0" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="700 -10; 1150 260" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Planet 1 -->
  <circle cx="1080" cy="90" r="42" fill="url(#planetGrad1)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="1080" cy="90" rx="66" ry="10" fill="none" stroke="#58A6FF" stroke-width="1.5" opacity="0.55" transform="rotate(-18 1080 90)"/>

  <!-- Planet 2 (small, orange) -->
  <circle cx="150" cy="210" r="20" fill="url(#planetGrad2)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="60" y="140" font-family="Fira Code, monospace" font-size="42" fill="#ffffff" font-weight="700">
    Muhammad Abdullah Kamran
  </text>
  <text x="60" y="180" font-family="Fira Code, monospace" font-size="20" fill="#58A6FF">
    &gt; Builder by Habit. Breaker by Choice.
  </text>
  <text x="60" y="210" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e">
    Full-Stack Developer // SOC Analyst in training // Karachi, PK
  </text>

  <!-- Blinking cursor -->
  <rect x="565" y="192" width="10" height="18" fill="#58A6FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
